<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Recommendations</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.35rem; margin-bottom: 4px; }
  #status { color: #777; font-size: 0.88rem; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  select, button { font-size: 0.95rem; padding: 7px 12px; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #222; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #444; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  th { color: #666; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.rank { color: #999; width: 28px; }
  td.genres { color: #888; font-size: 0.82rem; }
  td.score { color: #555; font-variant-numeric: tabular-nums; text-align: right; }
  #error { color: #b00020; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Movie Recommendations</h1>
<div id="status">Loading model info…</div>
<div class="row">
  <label for="userSelect">User:</label>
  <select id="userSelect"></select>
  <button id="goBtn">Get recommendations</button>
</div>
<div id="error"></div>
<table id="results">
  <thead><tr><th></th><th>Title</th><th>Genres</th><th>Score</th></tr></thead>
  <tbody></tbody>
</table>

<script>
async function init() {
  try {
    const health = await fetch('/health').then(r => r.json());
    document.getElementById('status').textContent =
      `Model: ${health.model} — generated ${health.generated_at} — ${health.n_users} users available`;

    const { user_ids } = await fetch('/users').then(r => r.json());
    const select = document.getElementById('userSelect');
    for (const uid of user_ids) {
      const opt = document.createElement('option');
      opt.value = uid;
      opt.textContent = `User ${uid}`;
      select.appendChild(opt);
    }
    document.getElementById('goBtn').addEventListener('click', () => loadRecs(select.value));
    if (user_ids.length > 0) loadRecs(select.value);
  } catch (err) {
    document.getElementById('status').textContent = 'Could not reach the API.';
    document.getElementById('error').textContent = String(err);
  }
}

async function loadRecs(userId) {
  const tbody = document.querySelector('#results tbody');
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  tbody.innerHTML = '<tr><td colspan="4">Loading…</td></tr>';
  try {
    const res = await fetch(`/recommend/${userId}?n=10`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    tbody.innerHTML = '';
    for (const row of data.recommendations) {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="rank">${row.rank}</td>` +
        `<td>${escapeHtml(row.title)}</td>` +
        `<td class="genres">${escapeHtml(row.genres)}</td>` +
        `<td class="score">${row.score}</td>`;
      tbody.appendChild(tr);
    }
  } catch (err) {
    tbody.innerHTML = '';
    errorEl.textContent = String(err.message || err);
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
