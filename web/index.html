<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Recommendations</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 920px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.35rem; margin-bottom: 4px; }
  h2 { font-size: 0.95rem; margin: 0 0 10px; color: #444; }
  #status { color: #777; font-size: 0.88rem; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  select, button { font-size: 0.95rem; padding: 7px 12px; border-radius: 6px; border: 1px solid #ccc; }
  button { background: #222; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #444; }
  #userMeta { color: #888; font-size: 0.85rem; margin-bottom: 20px; min-height: 1.2em; }
  .columns { display: flex; gap: 28px; flex-wrap: wrap; }
  .column { flex: 1 1 380px; min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eee; font-size: 0.88rem; }
  th { color: #666; font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  td.rank { color: #999; width: 24px; }
  td.genres { color: #888; font-size: 0.8rem; }
  td.score { color: #555; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  #error { color: #b00020; font-size: 0.9rem; margin-bottom: 10px; }

  /* Star bar: ONE <span class="star"> per star (not one clipped 5-char
     string) — clipping a percentage width across multiple glyphs doesn't
     land at a reliable visual boundary (browser kerning/whitespace eats
     the difference between e.g. 4.5/5=90% and 5/5=100%, so it silently
     rendered every rating >=4.5 as a full 5 stars). Per-star spans make
     "how many are filled" exact instead of approximate; only the HALF
     star (MovieLens ratings land on X.5) needs an inner clip, and that's
     clipping a single glyph's own box, which lines up reliably. title=""
     carries the exact number for anyone who hovers. */
  .stars { display: inline-flex; font-size: 0.95rem; line-height: 1; vertical-align: middle; }
  .star { color: #ddd; }
  .star-full { color: #e8a33d; }
  .star-half { position: relative; display: inline-block; color: #ddd; }
  .star-half-fill { position: absolute; top: 0; left: 0; width: 50%; overflow: hidden; color: #e8a33d; }
  td.rating { width: 6.5em; }

  /* Held-out hit: this movie was recommended by a model fit on train+val
     only, and the user's TEST-split rating (which the model never saw)
     confirms they liked it. Green because it is evidence the model works,
     not a warning. */
  .hit { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px;
         background: #e3f4e8; color: #1f6b38; font-size: 0.72rem; font-weight: 600;
         white-space: nowrap; vertical-align: middle; }
  tr.hit-row td { background: #fafdfb; }
  #hitNote { color: #1f6b38; font-size: 0.82rem; margin-top: 8px; min-height: 1.1em; }

  /* Cold-start fallback: this list is NOT from the hybrid model, it is the
     non-personalized Most-Popular baseline served because the batch job never
     scored this user. Amber, not red — the system is working as designed, but
     the viewer must not mistake these rows for a personalized result. */
  #fallbackNote { background: #fff6e5; border: 1px solid #f0d9a8; color: #7a5a12;
                  padding: 9px 11px; border-radius: 6px; font-size: 0.82rem;
                  margin-bottom: 10px; display: none; }
  #fallbackNote.show { display: block; }
  #fallbackNote b { color: #5c4409; }
  input[type=number] { font-size: 0.95rem; padding: 7px 10px; border-radius: 6px;
                       border: 1px solid #ccc; width: 11em; }
  .hint { color: #999; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Movie Recommendations</h1>
<div id="status">Loading model info…</div>
<div class="row">
  <label for="userSelect">User:</label>
  <select id="userSelect"></select>
  <span class="hint">or</span>
  <input id="userInput" type="number" min="1" placeholder="any id, e.g. 611">
  <span class="hint">an id the batch job never scored</span>
</div>
<div id="userMeta"></div>
<div id="error"></div>

<div class="columns">
  <div class="column">
    <h2>What this user actually loved (their own ratings)</h2>
    <table id="profileTable">
      <thead><tr><th>Their rating</th><th>Title</th><th>Genres</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="column">
    <div class="row">
      <h2 style="margin:0">Recommended for them (Nested Hybrid model)</h2>
      <button id="recommendBtn">Recommend</button>
    </div>
    <div id="fallbackNote"></div>
    <table id="resultsTable">
      <thead><tr><th></th><th>Title</th><th>Genres</th><th id="scoreHeader">Score</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="hitNote"></div>
  </div>
</div>

<script>
async function init() {
  try {
    const health = await fetch('/health').then(r => r.json());
    document.getElementById('status').textContent =
      `Model: ${health.model} — generated ${health.generated_at} — ${health.n_users} users available`;

    const { user_ids } = await fetch('/users').then(r => r.json());
    const select = document.getElementById('userSelect');
    for (const uid of user_ids) {
      const opt = document.createElement('option');
      opt.value = uid;
      opt.textContent = `User ${uid}`;
      select.appendChild(opt);
    }
    // Changing the dropdown only loads the LEFT column (the user's own
    // ratings) automatically — cheap, and there's nothing to "trigger" in
    // showing data that already exists. The RIGHT column (the model's
    // recommendations) only loads when the "Recommend" button is pressed,
    // on purpose: it reads as an explicit action ("run the model for this
    // user") instead of happening silently, and it means switching users
    // can never leave one user's ratings sitting next to a DIFFERENT
    // user's stale recommendations — see resetRecommendations() below.
    const input = document.getElementById('userInput');
    select.addEventListener('change', () => {
      input.value = '';            // the dropdown wins once it is touched
      loadProfile(select.value);
      resetRecommendations();
    });
    // Typing an id only clears the stale result; it does not fetch anything.
    // Same reasoning as the dropdown: the RIGHT column is an explicit action.
    input.addEventListener('input', resetRecommendations);
    // Pressing Enter after typing an id is the expected way to submit a text
    // box — without this, Enter does nothing and the box looks stuck. type=
    // "number" still fires a normal keydown for Enter, so this is safe.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runRecommend(currentUserId());
    });
    document.getElementById('recommendBtn').addEventListener('click', () => runRecommend(currentUserId()));
    resetRecommendations();
    if (user_ids.length > 0) loadProfile(select.value);
  } catch (err) {
    document.getElementById('status').textContent = 'Could not reach the API.';
    document.getElementById('error').textContent = String(err);
  }
}

// The typed box takes precedence when it has a value, so an id that is not in
// the dropdown at all can still be requested — which is the only way to reach
// the cold-start path from the UI.
function currentUserId() {
  const typed = document.getElementById('userInput').value.trim();
  return typed !== '' ? typed : document.getElementById('userSelect').value;
}

let loadedProfileId = null;   // which user the LEFT column is currently showing

function resetRecommendations() {
  document.getElementById('hitNote').textContent = '';
  const fb = document.getElementById('fallbackNote');
  fb.className = '';
  fb.textContent = '';
  document.getElementById('scoreHeader').textContent = 'Score';
  document.querySelector('#resultsTable tbody').innerHTML =
    '<tr><td colspan="4" style="color:#999">Click "Recommend" to generate suggestions for this user.</td></tr>';
}

async function loadProfile(userId) {
  const errorEl = document.getElementById('error');
  const metaEl = document.getElementById('userMeta');
  const profileBody = document.querySelector('#profileTable tbody');

  errorEl.textContent = '';
  metaEl.textContent = '';
  profileBody.innerHTML = '<tr><td colspan="3">Loading…</td></tr>';

  const res = await fetch(`/profile/${userId}?n=8`);
  if (!res.ok) {
    // 404 here is the expected, correct answer for a user the system has never
    // seen: they genuinely have no ratings. That is not an error to show in
    // red — it is the whole point of the cold-start demonstration.
    loadedProfileId = String(userId);
    if (res.status === 404) {
      metaEl.textContent = 'No rating history on file — this is a new user.';
      profileBody.innerHTML =
        '<tr><td colspan="3" style="color:#999">Nothing to show: the system has ' +
        'never seen a rating from this user.</td></tr>';
    } else {
      const body = await res.json().catch(() => ({}));
      errorEl.textContent = body.detail || `HTTP ${res.status}`;
      profileBody.innerHTML = '';
    }
    return;
  }

  const profile = await res.json();
  loadedProfileId = String(userId);
  metaEl.textContent =
    `${profile.n_ratings} ratings on record, average ${profile.mean_rating} stars`;

  profileBody.innerHTML = '';
  for (const row of profile.top_rated) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td class="rating">${starBar(row.rating)}</td>` +
      `<td>${escapeHtml(row.title)}</td>` +
      `<td class="genres">${escapeHtml(row.genres)}</td>`;
    profileBody.appendChild(tr);
  }
}

async function runRecommend(userId) {
  const errorEl = document.getElementById('error');
  const resultsBody = document.querySelector('#resultsTable tbody');

  // Recommending for a typed id while the left column still shows whoever was
  // last selected would put two different users side by side. Reload it first.
  if (String(userId) !== String(loadedProfileId)) {
    await loadProfile(userId);
  }

  errorEl.textContent = '';
  resultsBody.innerHTML = '<tr><td colspan="4">Loading…</td></tr>';

  const res = await fetch(`/recommend/${userId}?n=10`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    errorEl.textContent = body.detail || `HTTP ${res.status}`;
    resultsBody.innerHTML = '';
    return;
  }

  const rec = await res.json();
  resultsBody.innerHTML = '';

  // is_fallback means the batch job never scored this user, so what came back
  // is the Most-Popular baseline, not the hybrid. The 'score' column is then a
  // train+val rating COUNT rather than a model score, so the header changes too.
  if (rec.is_fallback) {
    const fb = document.getElementById('fallbackNote');
    fb.className = 'show';
    fb.innerHTML =
      `<b>Cold-start fallback — not a personalized result.</b><br>` +
      escapeHtml(rec.fallback_reason || '') +
      `<br>Serving: ${escapeHtml(rec.model)}.`;
    document.getElementById('scoreHeader').textContent = 'Ratings';
  }

  let hits = 0;
  for (const row of rec.recommendations) {
    // held_out_rating is set only when this user rated this movie in the
    // TEST split — data the model was never fit on. So the row is not "a
    // movie they already rated" showing up by mistake, it is the model
    // predicting something that turned out to be right.
    const isHit = row.held_out_rating != null;
    if (isHit) hits++;
    const tr = document.createElement('tr');
    if (isHit) tr.className = 'hit-row';
    const badge = isHit
      ? `<span class="hit" title="The model was fit on train+val only and never saw this rating">` +
        `✓ they rated this ${row.held_out_rating}★</span>`
      : '';
    tr.innerHTML =
      `<td class="rank">${row.rank}</td>` +
      `<td>${escapeHtml(row.title)}${badge}</td>` +
      `<td class="genres">${escapeHtml(row.genres)}</td>` +
      `<td class="score">${row.score}</td>`;
    resultsBody.appendChild(tr);
  }

  const note = document.getElementById('hitNote');
  note.textContent = hits === 0
    ? ''
    : `${hits} of these ${hits === 1 ? 'is a movie' : 'are movies'} the user really did rate — ` +
      `in held-out test data the model was never fit on.`;
}

function starBar(rating) {
  // Snap to the nearest 0.5 (MovieLens ratings are always whole or
  // half-star), then render an EXACT count of full/half/empty stars —
  // see the .stars CSS comment for why per-star spans replace a single
  // clipped 5-glyph string.
  const rounded = Math.round(Math.max(0, Math.min(5, rating)) * 2) / 2;
  const full = Math.floor(rounded);
  const hasHalf = rounded - full === 0.5;
  const empty = 5 - full - (hasHalf ? 1 : 0);

  let html = `<span class="stars" title="${rating} / 5">`;
  html += '<span class="star star-full">★</span>'.repeat(full);
  if (hasHalf) {
    html += '<span class="star star-half"><span class="star-half-fill">★</span>★</span>';
  }
  html += '<span class="star">★</span>'.repeat(empty);
  html += '</span>';
  return html;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
